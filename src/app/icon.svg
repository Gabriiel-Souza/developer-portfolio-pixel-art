<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Ciano neon glow filter -->
  <defs>
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#neon)">
    <!-- Letra G em pixel art 32x32 - outline ciano -->
    <!-- Row 1 -->
    <rect x="8"  y="4"  width="4" height="4" fill="#00FFFF"/>
    <rect x="12" y="4"  width="4" height="4" fill="#00FFFF"/>
    <rect x="16" y="4"  width="4" height="4" fill="#00FFFF"/>
    <rect x="20" y="4"  width="4" height="4" fill="#00FFFF"/>
    <!-- Row 2 -->
    <rect x="4"  y="8"  width="4" height="4" fill="#00FFFF"/>
    <rect x="8"  y="8"  width="4" height="4" fill="#0033CC"/>
    <rect x="12" y="8"  width="4" height="4" fill="#0033CC"/>
    <rect x="16" y="8"  width="4" height="4" fill="#0033CC"/>
    <rect x="20" y="8"  width="4" height="4" fill="#0033CC"/>
    <rect x="24" y="8"  width="4" height="4" fill="#00FFFF"/>
    <!-- Row 3 -->
    <rect x="4"  y="12" width="4" height="4" fill="#00FFFF"/>
    <rect x="8"  y="12" width="4" height="4" fill="#0033CC"/>
    <!-- Row 4 -->
    <rect x="4"  y="16" width="4" height="4" fill="#00FFFF"/>
    <rect x="8"  y="16" width="4" height="4" fill="#0033CC"/>
    <rect x="16" y="16" width="4" height="4" fill="#00FFFF"/>
    <rect x="20" y="16" width="4" height="4" fill="#00FFFF"/>
    <rect x="24" y="16" width="4" height="4" fill="#00FFFF"/>
    <!-- Row 5 -->
    <rect x="4"  y="20" width="4" height="4" fill="#00FFFF"/>
    <rect x="8"  y="20" width="4" height="4" fill="#0033CC"/>
    <rect x="16" y="20" width="4" height="4" fill="#0033CC"/>
    <rect x="20" y="20" width="4" height="4" fill="#0033CC"/>
    <rect x="24" y="20" width="4" height="4" fill="#00FFFF"/>
    <!-- Row 6 -->
    <rect x="8"  y="24" width="4" height="4" fill="#00FFFF"/>
    <rect x="12" y="24" width="4" height="4" fill="#00FFFF"/>
    <rect x="16" y="24" width="4" height="4" fill="#00FFFF"/>
    <rect x="20" y="24" width="4" height="4" fill="#00FFFF"/>
  </g>
</svg>
